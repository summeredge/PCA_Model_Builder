[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pca-model-builder"
version = "0.1.0"
description = "Offline dynamic PCA model builder for industrial process monitoring"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "scipy>=1.12",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pca-model-builder = "pca_model_builder.cli_entry:main"
pca-model-builder-web = "pca_model_builder.web_model_results:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pca_model_builder = ["*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
